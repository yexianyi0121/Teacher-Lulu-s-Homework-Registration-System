.5:1），不会出现深字压深底；打印与导出报表不受主题影响。"]},{id:"status",title:"盖章 / 过关 / 请假 / 缺交 的区别",icon:"🏷️",intro:"四个正交的状态，互不覆盖，但报表落点不同。",steps:["盖章（已更正/优秀）：不改值，只影响「需更正」名单的子段与海报角标。","过关 G：过关制的主值，置过关时值清空；再按一次取消。","缺交 X：状态位，值必须为空，进【暂未提交】。","请假 L：独立计数，不进任何名单、不计平均分。"],tips:["「缺交 + 补交」会进【已补交】；补交后仍不达标会同时出现在【需更正】。","「达标」与「过关」是两把尺子：达标按分数线（≥及格线）算，过关按等级白名单（默认 A+/A）算。所以 A-（90 分）会「达标但不过关」，这是预期行为，不是 bug；要改白名单去【设置 → 过关规则】。"]},{id:"makeup",title:"补交",icon:"📥",intro:"用于「昨天没交、今天补上了」的场景。",steps:["选中一个或多个缺交/未达标的学生。","点【📥 补交】填写说明（≤30 字，如「10/24 课后补交，全对」）。","确认后进【已补交】段；若老师补录了达标的分数，则不再进【需更正】。"],tips:["补交本身不给分，只标状态；要改成绩请直接补录值。"]},{id:"report",title:"生成报表与海报",icon:"📋",intro:"报表是一段可直接粘到微信群的纯文本，海报是一张 1080 宽的竖图。",steps:["点【报表生成】→ 预览文案 → 【复制文案】或【下载 txt】。","点【单条海报】→ 生成 PNG → 【复制图片】直接粘群或【下载 PNG】；手机上优先用【分享图片】。","名单按 70 个半角单位折行，粘到微信不会挤成一团。"],tips:["班级行恒输出，改班级名后报表与海报会立刻跟着变。"]},{id:"daily",title:"当日汇总截图",icon:"📸",intro:"一天登记了听写、语文本、卷子三样，想一张图发群时用它。",steps:["点【📸 当日汇总】，系统取当前班级当天的全部登记（含已固化到历史的）。","每张登记一个 section，按录入时间排序，右侧显示该表最相关的统计。","超过 6 条只展示最近 6 条，并提示总数。"],tips:["当日没有任何登记时会提示「今日暂无登记」，不会生成空图。"]},{id:"week-summary",title:"本周汇总与三向切换",icon:"🗓️",intro:"一个星期的多张登记想一张图发群时用【本周汇总】；同一天的多张表用【当日汇总】。",steps:["点【🗓️ 本周汇总】→ 系统取本周（周一至周日）当前班级的全部登记，按日期分节拼接成一张长图。","本周没有登记的日子会写「当日无登记」，不会跳过，方便一眼看出哪天漏记。","【单条海报】出单张表的图：可以先选「出哪张表」，换表后立即重新生成，不用关掉重开。","图太长会自动分卷，按卷下载；文件名带周区间（如 2026-10-19_2026-10-25）。"],tips:["单条 / 当日 / 本周三个按钮共用同一个预览窗口，切换后内容立刻重算，标题徽章随之变化。"]},{id:"points",title:"积分",icon:"⭐",intro:"把「连续 3 次全对 +5」这类口头规则变成可审计的账本。",steps:["默认 8 条规则，可在【统计 → 规则】里改分值或停用（内置规则不可删除）。","自动规则在保存录入时触发，命中有 Toast 提示；同一规则同一登记只记一次。","手动给分：选中学生 → 菜单【⭐ 给分】→ 选规则或自填 −10~+10 → 必填理由。","账本可撤销：撤销会写一条反向记录，原记录保留以便审计。"],tips:["积分按「登记日期」归月，不是按保存时间。"]},{id:"comment-rules",title:"评价语与自定义积分规则",icon:"✍️",intro:"海报页脚那句点评和积分规则，都能按自己班的口径定制。",steps:["评价语：【设置 → 海报】填默认评价语（≤60 字，可带表情），每次出海报时还能在弹窗里临时改一次。","学校行：设置里打开「海报显示学校名」，海报底部会多一行学校与班级署名。","积分规则：【统计 → 规则】右上角【＋ 新建规则】；条件是点选（如「连续 3 次全对」），不用自己写文本。","删除自定义规则会二次确认，并自动冲正该规则已发的积分（写一条反向记录），账本始终可审计。"],tips:["评价语只出现在海报页脚，报表文案暂不带评价语；内置积分规则不可删除，只能改分值或停用。"]},{id:"export",title:"导出（月度 / 学期）",icon:"📤",intro:"给需要自己再做统计的场景准备：一个 zip，三个 CSV。",steps:["【设置 → 导出】或统计页右上【导出】。","选班级与区间（本月 / 本学期 / 自定义起止日）。","得到 zip：登记明细、月度积分、汇总三张表。"],tips:["CSV 带 UTF-8 BOM，Excel 双击打开中文不乱码。"]},{id:"data-safety",title:"数据健康与备份恢复",icon:"🛡️",intro:"数据只存在这台电脑的浏览器里，所以「能不能找回来」比什么都重要。",steps:["入口：【设置 → 数据】的「数据健康」面板，显示主存大小、最近快照时间、最近备份时间，以及是否发现坏块。","导出备份：点【导出全部】得到一份 JSON（含班级、名单、历史、积分账本）；换电脑、换浏览器后用它恢复。","导入恢复：导入前系统会先把当前数据另存为「导入前快照」，导入不满意可一键回退。","自愈：万一主存损坏，下次打开会自动从最近的 IndexedDB 快照恢复，坏原文另存为 xq.corrupt.*，不会静默丢弃。"],tips:["覆盖保护：发现「内存是空的、磁盘还有数据」时会拒绝保存并提示先导出，避免误操作清空全班数据。","换域名 / 换地址打开会有提示——不同打开方式的数据空间是分开的，找回旧数据用【设置 → 数据 → 导入恢复】。"]},{id:"roster",title:"导入学生名单",icon:"📋",intro:"不用手打 50 个名字——从 Excel 或微信里复制粘贴即可。",steps:["点顶栏的 📁 按钮打开「导入花名册」。","【选择文件】支持 Excel（.xlsx / .xls）和 CSV、TXT；也可以直接把名单粘贴进下面的输入框。","粘贴时一行一人，三种写法都认：「1 张三」「1,张三」「张三」。","读完后会显示「已从〈工作表名〉读取到 N 人（表头在第 M 行）」，下面有前 8 个人名的预览。","点【导入 N 人】才真正写入；导入前的名单会自动留一份，误导入可以撤销。"],tips:["Excel 表头在第几行、哪一列是姓名，系统会自动找；找不到表头就按「含姓名最多的那一列」读，并告诉你猜的是哪一列。","「合计」「备注」「××登记表」这类行会被自动跳过，不会被当成学生。","一个 Excel 有多张工作表时，系统读当前第一张表；如果是「一个班一张」，先在 Excel 里把目标表拖到最前面。","导入只会替换【姓名】，已有成绩不受影响；人数变了系统会提示。"]},{id:"classes",title:"多班级",icon:"🏫",intro:"一个老师带多个班时，数据按班级完全隔离。",steps:["顶栏班级下拉可切换；【设置 → 班级管理】可新建/重命名/删除。","删除班级会二次确认，但历史记录不物理删除（可通过导出取回）。","报表、海报、导出、积分都只统计当前班级。"],tips:["切换班级不会刷新页面，正在看的日期与登记类型会保留。"]},{id:"voice",title:"语音录入",icon:"🎤",intro:"说「十二号 优秀」「五号 以更正」「二十三号 过官」都能落到正确学生。",steps:["点【🎤 语音】或按 Ctrl+M 开始聆听。","每条命令会在网格上闪示并出现确认条，1.5 秒内可撤销。","低置信度或歧义（如「不交」）需要你点确认，不会直接写错。"],tips:["识别连不上时提示换 Edge 或检查网络（Chrome 的中文识别依赖网络服务）。","可在设置里导出语音纠错日志，帮助后续扩充同音词表。"]},{id:"mobile",title:"手机端使用",icon:"📱",intro:"界面自适应手机浏览器，也可以「添加到主屏幕」当 App 用；数据仍只存在本机，不上传。",steps:["录入：点格子 → 底部升起数字键盘（数字 / 等级 / 过关 / 缺交 / 请假 / 清空），不用物理键盘；秒跳开着会连续跳到下一格。","输出：底部固定操作条四个图标 = 报表 / 单条海报 / 当日汇总 / 本周汇总；条固定在屏幕底部，滚到再多学生也在眼前；键盘弹起时条会让位，点键盘上的【完成】就回来。海报生成后点【分享图片】直接调起系统分享（微信/QQ），不支持分享的环境自动改为下载。","安装：首次在手机打开会提示「添加到主屏幕」；安装后从主屏幕启动，全屏无地址栏，更像原生 App。","备份：手机端每 7 天未导出会提醒一次「建议备份到文件」（iPhone 久不用会清理网页数据，这是纯网页版的真实风险），点提
