o:"海报页脚那句点评和积分规则，都能按自己班的口径定制。",steps:["评价语：【设置 → 海报】填默认评价语（≤60 字，可带表情），每次出海报时还能在弹窗里临时改一次。","学校行：设置里打开「海报显示学校名」，海报底部会多一行学校与班级署名。","积分规则：【统计 → 规则】右上角【＋ 新建规则】；条件是点选（如「连续 3 次全对」），不用自己写文本。","删除自定义规则会二次确认，并自动冲正该规则已发的积分（写一条反向记录），账本始终可审计。"],tips:["评价语只出现在海报页脚，报表文案暂不带评价语；内置积分规则不可删除，只能改分值或停用。"]},{id:"export",title:"导出（月度 / 学期）",icon:"📤",intro:"给需要自己再做统计的场景准备：一个 zip，三个 CSV。",steps:["【设置 → 导出】或统计页右上【导出】。","选班级与区间（本月 / 本学期 / 自定义起止日）。","得到 zip：登记明细、月度积分、汇总三张表。"],tips:["CSV 带 UTF-8 BOM，Excel 双击打开中文不乱码。"]},{id:"data-safety",title:"数据健康与备份恢复",icon:"🛡️",intro:"数据只存在这台电脑的浏览器里，所以「能不能找回来」比什么都重要。",steps:["入口：【设置 → 数据】的「数据健康」面板，显示主存大小、最近快照时间、最近备份时间，以及是否发现坏块。","导出备份：点【导出全部】得到一份 JSON（含班级、名单、历史、积分账本）；换电脑、换浏览器后用它恢复。","导入恢复：导入前系统会先把当前数据另存为「导入前快照」，导入不满意可一键回退。","自愈：万一主存损坏，下次打开会自动从最近的 IndexedDB 快照恢复，坏原文另存为 xq.corrupt.*，不会静默丢弃。"],tips:["覆盖保护：发现「内存是空的、磁盘还有数据」时会拒绝保存并提示先导出，避免误操作清空全班数据。","换域名 / 换地址打开会有提示——不同打开方式的数据空间是分开的，找回旧数据用【设置 → 数据 → 导入恢复】。"]},{id:"classes",title:"多班级",icon:"🏫",intro:"一个老师带多个班时，数据按班级完全隔离。",steps:["顶栏班级下拉可切换；【设置 → 班级管理】可新建/重命名/删除。","删除班级会二次确认，但历史记录不物理删除（可通过导出取回）。","报表、海报、导出、积分都只统计当前班级。"],tips:["切换班级不会刷新页面，正在看的日期与登记类型会保留。"]},{id:"voice",title:"语音录入",icon:"🎤",intro:"说「十二号 优秀」「五号 以更正」「二十三号 过官」都能落到正确学生。",steps:["点【🎤 语音】或按 Ctrl+M 开始聆听。","每条命令会在网格上闪示并出现确认条，1.5 秒内可撤销。","低置信度或歧义（如「不交」）需要你点确认，不会直接写错。"],tips:["识别连不上时提示换 Edge 或检查网络（Chrome 的中文识别依赖网络服务）。","可在设置里导出语音纠错日志，帮助后续扩充同音词表。"]}];function Rw(e){const t=e.trim();return t?Pi.filter(n=>[n.title,n.intro??"",...n.steps??[],...n.tips??[]].join(`
